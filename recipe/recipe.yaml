schema_version: 1

context:
  version: "0.6.1"

package:
  name: tbkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tbkit/tbkit-${{ version }}.tar.gz
  sha256: f491d998f95bc7e2622134b500f101da25d59cb1768e9d03a385e609d54ab13c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7

tests:
  - python:
      imports:
        - tbkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/tbkit
  repository: https://github.com/cpoli/tbkit
  summary: A Python package to build and solve Tight-Binding models
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
