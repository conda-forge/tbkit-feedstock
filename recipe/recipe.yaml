schema_version: 1

context:
  version: "0.6.0"

package:
  name: tbkit
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/t/tbkit/tbkit-${{ version }}.tar.gz
  sha256: 2f7ca7c0f7474b14de5861edeca11826e2a1492356a73c8a8fa03fd98042140c

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools >=68
  run:
    - python >=${{ python_min }}
    - numpy >=1.24
    - scipy >=1.10
    - matplotlib-base >=3.7

tests:
  - python:
      imports:
        - tbkit
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  homepage: https://github.com/cpoli/tbkit
  repository: https://github.com/cpoli/tbkit
  summary: A Python package to build and solve Tight-Binding models
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - cpoli
